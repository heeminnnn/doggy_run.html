<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>누렁이와 산책</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@600;800&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #1a3a1a;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: 'Fredoka One', cursive;
    overflow: hidden;
  }
  #gameWrapper { position: relative; width: 800px; max-width: 100vw; }
  #gameTitle {
    text-align: center;
    color: #fff;
    font-size: 2.2rem;
    letter-spacing: 2px;
    margin-bottom: 10px;
    text-shadow: 0 0 20px #a8e063, 0 2px 4px #000;
  }
  #gameCanvas {
    display: block;
    border-radius: 18px;
    box-shadow: 0 8px 40px rgba(0,0,0,0.6), 0 0 0 3px #5c3d1e, 0 0 0 6px #8b5e2a;
    cursor: pointer;
  }
  #uiBar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 16px;
    color: #fff;
    font-size: 1rem;
    text-shadow: 0 1px 3px #000;
  }
  #controls {
    text-align: center;
    color: rgba(255,255,255,0.7);
    font-family: 'Nunito', sans-serif;
    font-size: 0.85rem;
    margin-top: 6px;
    letter-spacing: 1px;
  }
  #progressBar {
    width: 100%;
    height: 10px;
    background: rgba(0,0,0,0.3);
    border-radius: 5px;
    margin: 4px 0;
    overflow: hidden;
    border: 1px solid rgba(255,255,255,0.2);
  }
  #progressFill {
    height: 100%;
    background: linear-gradient(90deg, #56ab2f, #a8e063);
    border-radius: 5px;
    transition: width 0.2s;
    box-shadow: 0 0 8px #56ab2f;
  }

  #mobileControls {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 16px;
    gap: 12px;
  }
  .mobileBtn {
    flex: 1;
    height: 72px;
    border: none;
    border-radius: 16px;
    font-family: 'Fredoka One', cursive;
    font-size: 1.3rem;
    font-weight: bold;
    cursor: pointer;
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
    box-shadow: 0 5px 0px rgba(0,0,0,0.35);
    transition: transform 0.08s, box-shadow 0.08s;
    letter-spacing: 1px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
  }
  .mobileBtn:active {
    transform: translateY(4px);
    box-shadow: 0 1px 0px rgba(0,0,0,0.35);
  }
  #btnJump {
    background: linear-gradient(180deg, #56d364, #2ea84e);
    color: #fff;
    text-shadow: 0 1px 3px rgba(0,0,0,0.4);
  }
  #btnSlide {
    background: linear-gradient(180deg, #f5a623, #d4831a);
    color: #fff;
    text-shadow: 0 1px 3px rgba(0,0,0,0.4);
  }
  .btnIcon { font-size: 1.6rem; line-height: 1; }
  .btnLabel { font-size: 0.95rem; }
</style>
</head>
<body>
<div id="gameWrapper">
  <div id="gameTitle">🐾 누렁이와 산책 🐾</div>
  <div id="uiBar">
    <span id="scoreDisplay">Score: 0</span>
    <div style="flex:1; margin: 0 16px;">
      <div style="font-size:0.75rem; text-align:center; margin-bottom:2px; color:#a8e063;">Progress to Finish</div>
      <div id="progressBar"><div id="progressFill" style="width:0%"></div></div>
    </div>
    <span id="timerDisplay">3:00</span>
  </div>
  <canvas id="gameCanvas" width="800" height="320"></canvas>
  <div id="controls">↑ or SPACE = Jump &nbsp;|&nbsp; ↓ = Slide &nbsp;|&nbsp; Click canvas to start</div>
  <div id="mobileControls">
    <button class="mobileBtn" id="btnJump">
      <span class="btnIcon">⬆️</span>
      <span class="btnLabel">JUMP</span>
    </button>
    <button class="mobileBtn" id="btnSlide">
      <span class="btnIcon">⬇️</span>
      <span class="btnLabel">SLIDE</span>
    </button>
  </div>
</div>

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

const GROUND_Y = H - 60;
const BEAR_X = 110;
const GAME_DURATION = 180;
const GRAVITY = 0.55;
const JUMP_FORCE = -13;

const imgRun   = new Image(); imgRun.src   = IMG_RUN_B64;
const imgSlide = new Image(); imgSlide.src = IMG_SLIDE_B64;
const imgJump  = new Image(); imgJump.src  = IMG_JUMP_B64;

let state = 'start';
let bear, obstacles, clouds, trees, score, startTime, frameCount;
let animFrame = 0, animTick = 0;
let bgScroll = 0;

function initGame() {
  bear = {
    x: BEAR_X, y: GROUND_Y - 80,
    vy: 0,
    state: 'run',
    w: 72, h: 80,
    slideW: 110, slideH: 48,
    jumpCount: 0,
    invincible: 0,
  };
  obstacles = [];
  clouds = Array.from({length:6}, (_,i) => ({
    x: i * 160 + 60,
    y: 20 + Math.random()*50,
    w: 60 + Math.random()*60,
    speed: 0.4 + Math.random()*0.3,
    alpha: 0.6 + Math.random()*0.3
  }));
  trees = Array.from({length:10}, (_,i) => ({
    x: i * 100,
    y: GROUND_Y - 90,
    type: Math.floor(Math.random()*3),
    size: 60 + Math.random()*40
  }));
  score = 0;
  startTime = performance.now();
  frameCount = 0;
  bgScroll = 0;
  animFrame = 0;
  animTick = 0;
}

let keys = {};
document.addEventListener('keydown', e => {
  // Always block browser scroll for game keys
  if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code)) {
    e.preventDefault();
  }
  keys[e.code] = true;
  if (state === 'playing') {
    if ((e.code === 'ArrowUp' || e.code === 'Space') && bear.jumpCount < 2) {
      bear.vy = JUMP_FORCE;
      bear.state = 'jump';
      bear.jumpCount++;
    }
    if (e.code === 'ArrowDown') {
      bear.state = 'slide';
    }
  }
  if (e.code === 'Space' && (state === 'start' || state === 'dead' || state === 'win')) {
    initGame();
    state = 'playing';
  }
});
document.addEventListener('keyup', e => {
  keys[e.code] = false;
  if (e.code === 'ArrowDown' && bear && bear.state === 'slide') {
    bear.state = bear.jumpCount > 0 ? 'jump' : 'run';
  }
});
canvas.addEventListener('click', () => {
  if (state === 'start' || state === 'dead' || state === 'win') {
    initGame();
    state = 'playing';
  } else if (state === 'playing') {
    if (bear.jumpCount < 2) {
      bear.vy = JUMP_FORCE;
      bear.state = 'jump';
      bear.jumpCount++;
    }
  }
});

function spawnObstacle(gameSpeed) {
  const type = Math.random() < 0.5 ? 'banana' : 'baseball';
  if (type === 'banana') {
    obstacles.push({ type:'banana', x:W+20, y:GROUND_Y-28, w:38, h:28, speed:gameSpeed });
  } else {
    obstacles.push({ type:'baseball', x:W+20, y:GROUND_Y-92, w:32, h:32, speed:gameSpeed+1, wobble:Math.random()*Math.PI*2 });
  }
}

function drawSky() {
  const sky = ctx.createLinearGradient(0,0,0,GROUND_Y);
  sky.addColorStop(0,'#87ceeb');
  sky.addColorStop(0.6,'#b8e4f9');
  sky.addColorStop(1,'#d4f0a0');
  ctx.fillStyle = sky;
  ctx.fillRect(0,0,W,GROUND_Y);
}

function drawSun() {
  ctx.save();
  ctx.globalAlpha = 0.9;
  const sg = ctx.createRadialGradient(W-80,45,5,W-80,45,40);
  sg.addColorStop(0,'#fffde7'); sg.addColorStop(0.5,'#ffd54f'); sg.addColorStop(1,'rgba(255,213,79,0)');
  ctx.fillStyle = sg;
  ctx.beginPath(); ctx.arc(W-80,45,40,0,Math.PI*2); ctx.fill();
  ctx.globalAlpha=1; ctx.restore();
}

function drawClouds() {
  ctx.save();
  for (const c of clouds) {
    ctx.globalAlpha = c.alpha;
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(c.x,c.y,c.w*0.28,0,Math.PI*2);
    ctx.arc(c.x+c.w*0.25,c.y-c.w*0.1,c.w*0.22,0,Math.PI*2);
    ctx.arc(c.x+c.w*0.5,c.y,c.w*0.25,0,Math.PI*2);
    ctx.arc(c.x+c.w*0.2,c.y+c.w*0.1,c.w*0.2,0,Math.PI*2);
    ctx.fill();
  }
  ctx.globalAlpha=1; ctx.restore();
}

function drawTree(x,y,type,size) {
  ctx.save();
  ctx.fillStyle='#7d5a3c';
  ctx.fillRect(x+size*0.38, y+size*0.5, size*0.15, size*0.55);
  if (type===0) {
    const leaf=ctx.createRadialGradient(x+size*0.45,y+size*0.2,size*0.05,x+size*0.45,y+size*0.25,size*0.45);
    leaf.addColorStop(0,'#88d14f'); leaf.addColorStop(0.5,'#5cb85c'); leaf.addColorStop(1,'#3d8b37');
    ctx.fillStyle=leaf;
    ctx.beginPath(); ctx.arc(x+size*0.45,y+size*0.25,size*0.4,0,Math.PI*2); ctx.fill();
    ctx.globalAlpha=0.3; ctx.fillStyle='#c8f08f';
    ctx.beginPath(); ctx.ellipse(x+size*0.35,y+size*0.1,size*0.15,size*0.1,-0.5,0,Math.PI*2); ctx.fill();
  } else if (type===1) {
    ctx.fillStyle='#3d8b37';
    ctx.beginPath(); ctx.moveTo(x+size*0.45,y); ctx.lineTo(x+size*0.85,y+size*0.65); ctx.lineTo(x+size*0.05,y+size*0.65); ctx.closePath(); ctx.fill();
    ctx.fillStyle='#56ab2f';
    ctx.beginPath(); ctx.moveTo(x+size*0.45,y+size*0.1); ctx.lineTo(x+size*0.8,y+size*0.6); ctx.lineTo(x+size*0.1,y+size*0.6); ctx.closePath(); ctx.fill();
  } else {
    ctx.fillStyle='#56ab2f';
    ctx.beginPath(); ctx.arc(x+size*0.35,y+size*0.35,size*0.3,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#3d8b37';
    ctx.beginPath(); ctx.arc(x+size*0.58,y+size*0.28,size*0.28,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#88d14f';
    ctx.beginPath(); ctx.arc(x+size*0.45,y+size*0.18,size*0.18,0,Math.PI*2); ctx.fill();
  }
  ctx.restore();
}

function drawGround() {
  ctx.fillStyle='#8b5e2a';
  ctx.fillRect(0,GROUND_Y,W,H-GROUND_Y);
  ctx.fillStyle='#7d5320';
  for (let i=0;i<10;i++) {
    ctx.fillRect((i*100+bgScroll*0.3)%W, GROUND_Y+8, 60, 4);
    ctx.fillRect((i*100+40+bgScroll*0.3)%W, GROUND_Y+18, 40, 3);
  }
  ctx.fillStyle='#5cb85c'; ctx.fillRect(0,GROUND_Y-4,W,8);
  ctx.fillStyle='#88d14f'; ctx.fillRect(0,GROUND_Y-6,W,4);
}

function drawDoggy(bear) {
  ctx.save();
  if (bear.invincible > 0 && Math.floor(bear.invincible/4)%2===0) ctx.globalAlpha=0.4;

  let img, bx, by, bw, bh;
  if (bear.state==='slide') {
    img=imgSlide; bw=bear.slideW; bh=bear.slideH;
    bx=bear.x-bw/2; by=GROUND_Y-bh+2;
  } else if (bear.state==='jump') {
    img=imgJump; bw=bear.w; bh=bear.h;
    bx=bear.x-bw/2; by=bear.y;
  } else {
    img=imgRun; bw=bear.w; bh=bear.h;
    bx=bear.x-bw/2;
    by=bear.y + Math.sin(animFrame*0.4)*2;
  }

  if (img.complete && img.naturalWidth>0) {
    ctx.drawImage(img, bx, by, bw, bh);
  } else {
    // fallback: draw a simple dog shape
    ctx.fillStyle='#f5d59a';
    ctx.beginPath(); ctx.arc(bear.x, bear.y+30, 28, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle='#e8c080';
    ctx.beginPath(); ctx.ellipse(bear.x-20, bear.y+10, 12, 8, -0.5, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(bear.x+14, bear.y+5, 10, 7, 0.5, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle='#333';
    ctx.beginPath(); ctx.arc(bear.x-8, bear.y+26, 3, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(bear.x+8, bear.y+26, 3, 0, Math.PI*2); ctx.fill();
  }
  ctx.restore();
}

function drawBanana(obs) {
  ctx.save();
  ctx.translate(obs.x+obs.w/2, obs.y+obs.h/2);
  ctx.strokeStyle='#f5c518'; ctx.lineWidth=5; ctx.lineCap='round';
  ctx.beginPath(); ctx.arc(0,0,14,Math.PI*1.1,Math.PI*1.9); ctx.stroke();
  ctx.strokeStyle='#f5a623'; ctx.lineWidth=3;
  ctx.beginPath(); ctx.arc(0,0,12,Math.PI*1.1,Math.PI*1.9); ctx.stroke();
  ctx.strokeStyle='#ffdd00'; ctx.lineWidth=2;
  for (let a=Math.PI*1.2; a<Math.PI*1.8; a+=0.2) {
    ctx.beginPath(); ctx.moveTo(Math.cos(a)*11,Math.sin(a)*11); ctx.lineTo(Math.cos(a)*15,Math.sin(a)*15); ctx.stroke();
  }
  ctx.fillStyle='rgba(255,80,0,0.85)';
  ctx.font='bold 11px Fredoka One, sans-serif'; ctx.textAlign='center';
  ctx.fillText('JUMP!',0,-18);
  ctx.restore();
}

function drawBaseball(obs) {
  ctx.save();
  const t=performance.now()/1000;
  ctx.translate(obs.x+obs.w/2, obs.y+obs.h/2);
  ctx.rotate(t*8+obs.wobble);
  const grad=ctx.createRadialGradient(-4,-4,1,0,0,15);
  grad.addColorStop(0,'#fff'); grad.addColorStop(1,'#e8e8e8');
  ctx.fillStyle=grad;
  ctx.beginPath(); ctx.arc(0,0,14,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle='#e74c3c'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.arc(0,0,12,-0.5,0.5); ctx.stroke();
  ctx.beginPath(); ctx.arc(0,0,12,Math.PI-0.5,Math.PI+0.5); ctx.stroke();
  ctx.restore();
  ctx.save();
  ctx.fillStyle='rgba(0,100,255,0.85)';
  ctx.font='bold 11px Fredoka One, sans-serif'; ctx.textAlign='center';
  ctx.fillText('SLIDE!', obs.x+obs.w/2, obs.y-6);
  ctx.restore();
}

function drawOverlay(text, sub, sub2) {
  ctx.save();
  ctx.fillStyle='rgba(0,0,0,0.55)'; ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#fff';
  ctx.font="bold 48px 'Fredoka One', cursive"; ctx.textAlign='center';
  ctx.shadowColor='#a8e063'; ctx.shadowBlur=20;
  ctx.fillText(text, W/2, H/2-20);
  ctx.shadowBlur=0;
  ctx.font="22px 'Fredoka One', cursive"; ctx.fillStyle='#ffd54f';
  ctx.fillText(sub, W/2, H/2+22);
  if (sub2) {
    ctx.font="16px 'Nunito', sans-serif"; ctx.fillStyle='rgba(255,255,255,0.75)';
    ctx.fillText(sub2, W/2, H/2+50);
  }
  ctx.restore();
}

function gameLoop() {
  requestAnimationFrame(gameLoop);
  ctx.clearRect(0,0,W,H);

  if (state==='start') {
    drawSky(); drawSun(); drawClouds();
    for (const t of trees) drawTree(t.x,t.y,t.type,t.size);
    drawGround();
    drawOverlay('🐾 누렁이와 산책','Click or press SPACE to start','↑/SPACE = Jump  |  ↓ = Slide');
    document.getElementById('progressFill').style.width='0%';
    document.getElementById('timerDisplay').textContent='3:00';
    document.getElementById('scoreDisplay').textContent='Score: 0';
    return;
  }
  if (state==='win') {
    drawSky(); drawSun(); drawClouds();
    for (const t of trees) drawTree(t.x,t.y,t.type,t.size);
    drawGround();
    drawOverlay('🎉 You Win! 🎉', 'Score: '+score, 'Click or SPACE to play again');
    return;
  }
  if (state==='dead') {
    drawSky(); drawSun(); drawClouds();
    for (const t of trees) drawTree(t.x,t.y,t.type,t.size);
    drawGround();
    if (bear) drawDoggy(bear);
    drawOverlay('💥 Ouch!','Score: '+score,'Click or SPACE to try again');
    return;
  }

  frameCount++; animTick++;
  if (animTick%6===0) animFrame++;

  const elapsed=(performance.now()-startTime)/1000;
  const remaining=Math.max(0,GAME_DURATION-elapsed);
  const progress=Math.min(1,elapsed/GAME_DURATION);
  const gameSpeed=4+progress*4;

  const mins=Math.floor(remaining/60);
  const secs=Math.floor(remaining%60);
  document.getElementById('timerDisplay').textContent=mins+':'+(secs<10?'0':'')+secs;
  document.getElementById('progressFill').style.width=(progress*100)+'%';
  score=Math.floor(elapsed*10);
  document.getElementById('scoreDisplay').textContent='Score: '+score;

  if (remaining<=0) { state='win'; return; }

  bgScroll+=gameSpeed;

  for (const c of clouds) {
    c.x-=c.speed;
    if (c.x+c.w<0) { c.x=W+20; c.y=20+Math.random()*50; }
  }
  for (const t of trees) {
    t.x-=gameSpeed*0.7;
    if (t.x+t.size<0) {
      t.x=W+20; t.type=Math.floor(Math.random()*3);
      t.size=60+Math.random()*40; t.y=GROUND_Y-80-Math.random()*30;
    }
  }

  // Obstacle spawn — random rate between current (0.02) and double (0.04) each frame
  const spawnChance = 0.02 + Math.random() * 0.02;
  const minGap=Math.max(200,400-progress*100);
  const rightmost=obstacles.length>0?Math.max(...obstacles.map(o=>o.x)):-Infinity;
  if (rightmost<W-minGap && Math.random()<spawnChance) spawnObstacle(gameSpeed);

  for (const obs of obstacles) obs.x-=obs.speed;
  obstacles=obstacles.filter(o=>o.x>-100);

  if (bear.state!=='slide') {
    bear.vy+=GRAVITY; bear.y+=bear.vy;
  }
  const groundLevel=GROUND_Y-bear.h;
  if (bear.y>=groundLevel) {
    bear.y=groundLevel; bear.vy=0; bear.jumpCount=0;
    if (bear.state==='jump') bear.state='run';
  }
  if (bear.invincible>0) bear.invincible--;

  // Collision
  if (bear.invincible===0) {
    for (const obs of obstacles) {
      let bL,bR,bT,bB;
      if (bear.state==='slide') {
        bL=bear.x-bear.slideW/2+10; bR=bear.x+bear.slideW/2-10;
        bT=GROUND_Y-bear.slideH+8; bB=GROUND_Y-2;
      } else {
        bL=bear.x-bear.w/2+12; bR=bear.x+bear.w/2-12;
        bT=bear.y+10; bB=bear.y+bear.h-6;
      }
      const oL=obs.x+4, oR=obs.x+obs.w-4, oT=obs.y+4, oB=obs.y+obs.h-4;
      if (bR>oL&&bL<oR&&bB>oT&&bT<oB) { state='dead'; return; }
    }
  }

  drawSky(); drawSun(); drawClouds();
  ctx.save(); ctx.globalAlpha=0.5;
  for (let i=0;i<6;i++) {
    const tx=((i*160+bgScroll*0.15)%(W+200))-100;
    drawTree(tx,GROUND_Y-65,i%3,50);
  }
  ctx.restore();
  for (const t of trees) drawTree(t.x,t.y,t.type,t.size);
  drawGround();
  for (const obs of obstacles) {
    if (obs.type==='banana') drawBanana(obs); else drawBaseball(obs);
  }
  drawDoggy(bear);

  if (progress>0.95) {
    ctx.save();
    ctx.font="bold 20px 'Fredoka One', cursive"; ctx.textAlign='center';
    ctx.fillStyle='#f5a623'; ctx.fillText('🏁 FINISH LINE AHEAD! 🏁',W/2,30);
    ctx.restore();
  }
  if (remaining<10) {
    ctx.save();
    ctx.fillStyle='rgba(255,0,0,'+(0.3+0.2*Math.sin(frameCount*0.3))+')';
    ctx.fillRect(0,0,W,H); ctx.restore();
  }
}

// Mobile button events
const btnJump = document.getElementById('btnJump');
const btnSlide = document.getElementById('btnSlide');

function doJump() {
  if (state === 'start' || state === 'dead' || state === 'win') {
    initGame(); state = 'playing'; return;
  }
  if (state === 'playing' && bear.jumpCount < 2) {
    bear.vy = JUMP_FORCE;
    bear.state = 'jump';
    bear.jumpCount++;
  }
}

function startSlide() {
  if (state === 'start' || state === 'dead' || state === 'win') {
    initGame(); state = 'playing'; return;
  }
  if (state === 'playing') bear.state = 'slide';
}

function endSlide() {
  if (state === 'playing' && bear && bear.state === 'slide') {
    bear.state = bear.jumpCount > 0 ? 'jump' : 'run';
  }
}

btnJump.addEventListener('touchstart', function(e){ e.preventDefault(); doJump(); }, {passive:false});
btnJump.addEventListener('mousedown', function(e){ e.preventDefault(); doJump(); });

btnSlide.addEventListener('touchstart', function(e){ e.preventDefault(); startSlide(); }, {passive:false});
btnSlide.addEventListener('touchend', function(e){ e.preventDefault(); endSlide(); }, {passive:false});
btnSlide.addEventListener('mousedown', function(e){ e.preventDefault(); startSlide(); });
btnSlide.addEventListener('mouseup', function(e){ e.preventDefault(); endSlide(); });

initGame();
gameLoop();
</script>
